[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlab"
version = "1.0.0"
description = "Cross-sectional factor research on the NIFTY 50: Value, Momentum, Quality and Low-Volatility built Fama-French style, with quintile long-short portfolios, IC analysis and Fama-MacBeth regressions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
